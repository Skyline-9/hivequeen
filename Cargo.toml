[package]
name = "hivequeen"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Run agent, command, and approval steps as a local workflow, with parallel editing in isolated Git worktrees."
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
